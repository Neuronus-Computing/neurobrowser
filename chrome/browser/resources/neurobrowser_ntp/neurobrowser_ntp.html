<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neuro Browser</title>
    <!-- <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap"
      rel="stylesheet"
    /> -->

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Montserrat", sans-serif;
        font-weight: 400;
        font-style: normal;
      }

      input::placeholder {
        color: black;
        font-size: 16px;
      }

      .dropdown-shadow {
        filter: drop-shadow(0 2px 5px rgba(92, 92, 92, 0.1))
          drop-shadow(0 9px 9px rgba(92, 92, 92, 0.09))
          drop-shadow(0 20px 12px rgba(92, 92, 92, 0.05))
          drop-shadow(0 35px 14px rgba(92, 92, 92, 0.01))
          drop-shadow(0 55px 15px rgba(92, 92, 92, 0));
      }

      .cursor-pointer {
        cursor: pointer;
      }

      .dropdown .dropdown-menu {
        display: none;
      }

      .dropdown.active .dropdown-menu {
        display: flex;
      }

      .dropdown {
        left: 12px;
      }

      .dropdown-menu {
        background: white;
        border-radius: 99px;
        flex-direction: column;
        align-items: center;
        position: absolute;
        left: 0;
        z-index: 1;
        width: 60px;
        gap: 15px;
        padding: 50px 12px 25px 12px;
        top: 25px;
      }

      .dropdown-menu svg {
        width: 100%;
        height: auto;
      }

      #dropdown-arrow.active {
        transform: rotate(180deg);
      }

      #dropdown-arrow {
        width: 14px;
        height: auto;
      }

      .search-input {
        width: 50vw;
        position: relative;
      }

      .search-input input {
        height: 74px;
        padding: 0px 65px 0px 120px;
        margin: 70px 0;
      }

      .search-input .right-icon {
        right: 20px;
        width: 32px;
        height: auto;
      }

      .logo {
        width: 124px;
        height: 124px;
        object-fit: cover;
        margin: 0 auto;
        display: block;
      }

      .title {
        font-size: 32px;
      }

      .dropdown-icon {
        width: 60px;
        height: 60px;
      }

      .heading {
        font-size: 30px;
      }

      @media screen and (max-width: 1500px) {
        .search-input {
          width: 70vw;
        }

        .logo {
          width: 116px;
          height: 116px;
        }

        .title {
          font-size: 28px;
        }

        .heading {
          font-size: 26px;
        }

        .search-input input {
          height: 64px;
          margin: 60px 0;
        }

        .dropdown-icon {
          width: 55px;
          height: 55px;
        }

        .dropdown {
          left: 10px;
        }

        .dropdown-menu {
          width: 55px;
          gap: 12px;
          padding: 45px 10px 20px 10px;
          top: 22px;
        }

        .search-input .right-icon {
          right: 18px;
          width: 30px;
          height: auto;
        }

        .recent-tabs div {
          width: 100px !important;
          height: 96px !important;
        }

        .recent-tabs svg {
          width: 34px !important;
          height: auto !important;
        }
      }

      @media screen and (max-width: 1288px) {
        .search-input {
          width: 80vw;
        }

        .logo {
          width: 100px;
          height: 100px;
        }

        .title {
          font-size: 24px;
        }

        .heading {
          font-size: 22px;
        }

        .search-input input {
          height: 54px;
          margin: 50px 0;
        }

        .dropdown-icon {
          width: 46px;
          height: 46px;
        }

        .dropdown {
          left: 6px;
        }

        .dropdown-menu {
          width: 46px;
          gap: 10px;
          padding: 40px 8px 16px 8px;
          top: 20px;
        }

        .search-input .right-icon {
          right: 16px;
          width: 28px;
          height: auto;
        }

        .recent-tabs div {
          width: 90px !important;
          height: 86px !important;
        }

        .recent-tabs svg {
          width: 30px !important;
          height: auto !important;
        }
      }

      @media screen and (max-width: 992px) {
        .search-input {
          width: 95vw;
        }

        .logo {
          width: 90px;
          height: 90px;
        }

        .title {
          font-size: 20px;
        }

        .heading {
          font-size: 18px;
        }

        .search-input input {
          height: 48px;
          margin: 40px 0;
        }

        .dropdown-icon {
          width: 40px;
          height: 40px;
        }

        .dropdown {
          left: 5px;
        }

        .dropdown-menu {
          width: 40px;
          gap: 8px;
          padding: 35px 6px 14px 6px;
          top: 15px;
        }

        .search-input .right-icon {
          right: 14px;
          width: 26px;
          height: auto;
        }

        .recent-tabs div {
          width: 80px !important;
          height: 76px !important;
        }

        .recent-tabs svg {
          width: 26px !important;
          height: auto !important;
        }
      }

      @media screen and (max-width: 768px) {
        .logo {
          width: 70px;
          height: 70px;
        }

        .search-input input {
          height: 40px;
          padding: 0px 45px 0px 65px;
          font-size: 14px !important;
        }

        .search-input input::placeholder {
          font-size: 14px !important;
        }

        .dropdown-icon {
          width: 32px;
          height: 32px;
        }

        .dropdown {
          left: 4px;
        }

        .dropdown-menu {
          width: 32px;
          gap: 6px;
          padding: 30px 4px 12px 4px;
          top: 10px;
        }

        #dropdown-arrow {
          width: 10px;
          height: auto;
        }

        .search-input .right-icon {
          right: 10px;
          width: 22px;
          height: auto;
        }

        .recent-tabs div {
          width: 70px !important;
          height: 66px !important;
        }

        .recent-tabs svg {
          width: 20px !important;
          height: auto !important;
        }
      }
    </style>
  </head>

    <!-- NTP JavaScript with static search engine icons -->
    <script>
      // Search engine configuration
      const SEARCH_ENGINES = {
        google: {
          name: 'Google',
          keyword: 'google.com',
          searchUrl: 'https://www.google.com/search?q={searchTerms}'
        },
        yahoo: {
          name: 'Yahoo',
          keyword: 'search.yahoo.com',
          searchUrl: 'https://search.yahoo.com/search?p={searchTerms}'
        },
        bing: {
          name: 'Bing',
          keyword: 'bing.com',
          searchUrl: 'https://www.bing.com/search?q={searchTerms}'
        },
        yandex: {
          name: 'Yandex',
          keyword: 'yandex.com',
          searchUrl: 'https://yandex.com/search/?text={searchTerms}'
        },
        duckduckgo: {
          name: 'DuckDuckGo',
          keyword: 'duckduckgo.com',
          searchUrl: 'https://duckduckgo.com/?q={searchTerms}'
        }
      };

      // DOM Elements
      const searchInput = document.getElementById('search');
      const dropdown = document.getElementById('dropdown');
      const arrow = document.getElementById('dropdown-arrow');
      const dropdownIcon = document.querySelector('.dropdown-icon');
      const dropdownMenu = document.querySelector('.dropdown-menu');
      const engineIcons = document.querySelectorAll('.search-engine-icon');

      // Current engine state
      let currentEngineId = localStorage.getItem('neuro_default_search') || 'google';

      // Initialize
      function init() {
        updateMainIcon();
        updatePlaceholder();
        setupEngineClickHandlers();
      }

      // Update the main dropdown icon to show current engine
      function updateMainIcon() {
        // Update main icon in dropdown button
        const mainIcons = document.querySelectorAll('.main-engine-icon');
        mainIcons.forEach(function(icon) {
          const iconEngine = icon.getAttribute('data-engine');
          if (iconEngine === currentEngineId) {
            icon.style.display = 'block';
          } else {
            icon.style.display = 'none';
          }
        });
        
        // Show current engine icon, hide others in dropdown
        engineIcons.forEach(function(icon) {
          const iconEngine = icon.getAttribute('data-engine');
          if (iconEngine === currentEngineId) {
            icon.style.opacity = '1';
          } else {
            icon.style.opacity = '0.6';
          }
        });
      }

      // Update placeholder text
      function updatePlaceholder() {
        if (searchInput && SEARCH_ENGINES[currentEngineId]) {
          searchInput.placeholder = 'Search ' + SEARCH_ENGINES[currentEngineId].name + ' or type a URL';
        }
      }

      // Setup click handlers for engine icons in dropdown
      function setupEngineClickHandlers() {
        engineIcons.forEach(function(icon) {
          icon.addEventListener('click', function(e) {
            e.stopPropagation();
            const engineId = this.getAttribute('data-engine');
            selectEngine(engineId);
          });
        });
      }

      // Select a search engine
      function selectEngine(engineId) {
        if (!SEARCH_ENGINES[engineId]) return;
        
        currentEngineId = engineId;
        localStorage.setItem('neuro_default_search', engineId);
        
        // Tell Chrome to set this as the default search engine
        const engine = SEARCH_ENGINES[engineId];
        if (typeof chrome !== 'undefined' && chrome.send) {
          chrome.send('setDefaultSearchEngine', [engine.keyword]);
        }
        
        // Update UI
        updateMainIcon();
        updatePlaceholder();
        
        // Close dropdown
        dropdown.classList.remove('active');
        arrow.classList.remove('active');
        searchInput.focus();
        
        console.log('Set default search engine to:', engine.name);
      }

      // Toggle dropdown
      if (arrow) {
        arrow.onclick = function() {
          dropdown.classList.toggle('active');
          arrow.classList.toggle('active');
        };
      }
      
      // Also toggle when clicking the main icon
      if (dropdownIcon) {
        dropdownIcon.onclick = function() {
          dropdown.classList.toggle('active');
          arrow.classList.toggle('active');
        };
      }

      // Build search URL
      function buildSearchUrl(query) {
        const engine = SEARCH_ENGINES[currentEngineId];
        if (!engine) {
          return 'https://www.google.com/search?q=' + encodeURIComponent(query);
        }
        return engine.searchUrl.replace('{searchTerms}', encodeURIComponent(query));
      }

      // Perform search
      function performSearch(query) {
        query = query.trim();
        if (!query) return;

        // Check if it's a URL
        if (query.indexOf('.') !== -1 && query.indexOf(' ') === -1) {
          if (!query.startsWith('http://') && !query.startsWith('https://')) {
            query = 'https://' + query;
          }
          window.location.href = query;
        } else {
          window.location.href = buildSearchUrl(query);
        }
      }

      // Search on Enter key
      if (searchInput) {
        searchInput.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            performSearch(searchInput.value);
          }
        });
      }

      // Close dropdown when clicking outside
      document.addEventListener('click', function(e) {
        if (dropdown && arrow && !dropdown.contains(e.target)) {
          dropdown.classList.remove('active');
          arrow.classList.remove('active');
        }
      });

      // Initialize
      init();
      
      // Focus search input
      if (searchInput) searchInput.focus();
    </script>
